name: ProfoundSyntax Managed QA Builder

on:
  workflow_dispatch:
    inputs:
      request_nonce:
        description: ProfoundSyntax one-time connection nonce
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  connection-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify ProfoundSyntax managed builder connection
        shell: bash
        env:
          PS_QA_REQUEST_NONCE: ${{ inputs.request_nonce }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          callback = "https://profoundsyntax.com/wp-json/profoundsyntax-community/v1/qa-builder/v2/managed/github/handshake"
          audience = "profoundsyntax-qa-builder"
          token_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token_auth = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          separator = "&" if "?" in token_url else "?"
          request = urllib.request.Request(
              token_url + separator + "audience=" + urllib.parse.quote(audience, safe=""),
              headers={"Authorization": "Bearer " + token_auth},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              oidc = json.load(response)["value"]

          payload = {
              "request_nonce": os.environ.get("PS_QA_REQUEST_NONCE", ""),
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
          }
          body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
          callback_request = urllib.request.Request(
              callback,
              data=body,
              method="POST",
              headers={
                  "Authorization": "Bearer " + oidc,
                  "Content-Type": "application/json",
                  "User-Agent": "ProfoundSyntax-Managed-QA/1.0",
              },
          )
          with urllib.request.urlopen(callback_request, timeout=30) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise SystemExit("ProfoundSyntax managed-builder handshake was rejected")
          print("ProfoundSyntax managed-builder handshake: PASS")
          PY
